<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrap">
    <h1>Snake</h1>

    <div class="hud">
      <div class="score">Puntaje: <span id="score">0</span></div>
      <div class="best">Mejor: <span id="best">0</span></div>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="400" height="400"></canvas>

      <div id="overlay" class="overlay">
        <div class="overlay-content">
          <h2 id="overlay-title">Snake</h2>
          <p id="overlay-msg">Usa las flechas o WASD para moverte.</p>
          <button id="start-btn">Jugar</button>
        </div>
      </div>
    </div>

    <div class="controls-hint">
      Flechas / WASD para moverte &middot; Espacio para pausar
    </div>

    <div class="touch-controls" id="touch-controls">
      <button data-dir="up" class="tc-btn tc-up">&uarr;</button>
      <div class="tc-row">
        <button data-dir="left" class="tc-btn tc-left">&larr;</button>
        <button data-dir="down" class="tc-btn tc-down">&darr;</button>
        <button data-dir="right" class="tc-btn tc-right">&rarr;</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
