<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Snake Game</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1 class="app__title">🐍 Snake</h1>
      <div class="hud">
        <div class="hud__item">
          <span class="hud__label">Puntaje</span>
          <span class="hud__value" id="scoreValue">0</span>
        </div>
        <div class="hud__item">
          <span class="hud__label">Récord</span>
          <span class="hud__value" id="highScoreValue">0</span>
        </div>
        <div class="hud__item">
          <span class="hud__label">Nivel</span>
          <span class="hud__value" id="levelValue">1</span>
        </div>
      </div>
    </header>

    <main class="board-wrapper">
      <canvas id="gameCanvas" class="board" aria-label="Tablero del juego Snake" role="img"></canvas>

      <div class="overlay" id="startOverlay">
        <div class="overlay__panel">
          <h2>Snake</h2>
          <p>Usa las flechas o WASD para moverte.</p>
          <p>Presiona <kbd>Espacio</kbd> para pausar.</p>
          <button class="btn btn--primary" id="startButton" type="button">Iniciar juego</button>
        </div>
      </div>

      <div class="overlay overlay--hidden" id="pauseOverlay">
        <div class="overlay__panel">
          <h2>Pausado</h2>
          <p>Presiona <kbd>Espacio</kbd> para continuar.</p>
        </div>
      </div>

      <div class="overlay overlay--hidden" id="gameOverOverlay">
        <div class="overlay__panel">
          <h2 id="gameOverTitle">Game Over</h2>
          <p>Puntaje final: <span id="finalScoreValue">0</span></p>
          <p id="newRecordMessage" class="new-record hidden">¡Nuevo récord!</p>
          <button class="btn btn--primary" id="restartButton" type="button">Reintentar</button>
        </div>
      </div>
    </main>

    <footer class="controls-info">
      <div class="controls-info__keys">
        <span>⬆️⬇️⬅️➡️ / WASD: mover</span>
        <span>Espacio: pausar</span>
      </div>
      <button class="btn btn--icon" id="soundToggle" type="button" aria-pressed="true" title="Activar/Desactivar sonido">🔊</button>
    </footer>

    <div class="touch-controls" id="touchControls">
      <button class="touch-btn touch-btn--up" data-direction="up" type="button" aria-label="Mover arriba">▲</button>
      <button class="touch-btn touch-btn--left" data-direction="left" type="button" aria-label="Mover izquierda">◀</button>
      <button class="touch-btn touch-btn--down" data-direction="down" type="button" aria-label="Mover abajo">▼</button>
      <button class="touch-btn touch-btn--right" data-direction="right" type="button" aria-label="Mover derecha">▶</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
